name: deploy-pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: yarnpkg
      - name: create src/secrets.json
        env:
          OVERPASS_NEXTGIS_KEY: ${{ secrets.OVERPASS_NEXTGIS_KEY }}
        run: |
          cp src/secrets.json.template src/secrets.json
          if [ -n "$OVERPASS_NEXTGIS_KEY" ]; then
            jq --arg key "$OVERPASS_NEXTGIS_KEY" '.overpassNextgis = $key' src/secrets.json > src/secrets.json.new
            mv src/secrets.json.new src/secrets.json
          fi
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
