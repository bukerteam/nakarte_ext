name: check

on:
  push:
    branches: [master]
  pull_request:
  schedule:
      - cron: '15 3 * * *'

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'yarn'
      - run: cp src/secrets.json.template src/secrets.json
      - run: yarnpkg

      - run: npm run lint:code
      - run: npm run lint:style
      - run: npm run build

  test:
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: FirefoxHeadless
            firefox-version: '52.9.0esr'
            os: ubuntu-22.04
            needs-xvfb: true
          - browser: FirefoxHeadless
            firefox-version: 'latest'
          - browser: ChromeHeadless
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'yarn'
      - run: cp src/secrets.json.template src/secrets.json
      - run: yarnpkg

      - name: install specific version of Firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: ${{matrix.firefox-version}}
        if: matrix.firefox-version
      - run: npm run test -- --browsers ${{matrix.browser}}
        if: ${{! matrix.needs-xvfb}}
      - name: run tests with xvfb
        run: xvfb-run --auto-servernum npm run test -- --browsers ${{matrix.browser}}
        if: matrix.needs-xvfb
